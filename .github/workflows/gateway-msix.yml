name: Build isolated Gateway recovery candidate

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        type: choice
        options: [test]
        default: test
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  candidate:
    if: inputs.signing_mode == 'test' && inputs.publish_release == false
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Compose the assembled prerequisites through the native package owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $commit = (& git rev-parse HEAD) -join ''
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[a-f0-9]{40}$') { throw 'The frozen source commit is invalid.' }
          if (@(& git status --porcelain).Count -ne 0 -or $LASTEXITCODE -ne 0) { throw 'The candidate checkout must be clean.' }
          $policy = Get-Content ./release-policy.json -Raw | ConvertFrom-Json
          $identity = & ./scripts/Get-MSIXReleaseIdentity.ps1 -GatewayTag v2026.10.4 -MSIXRevision $policy.msixRevision
          if ($identity.PackageVersion -cne '2026.10.401.0' -or $identity.ReleaseTag -cne 'v2026.10.4-msix.1') { throw 'This proof is pinned to the requested packaging-only patch identity.' }
          $artifactRoot = Join-Path $root 'artifacts/recovery-candidate'
          $unsignedRoot = Join-Path $artifactRoot 'unsigned'
          $unsigned = Join-Path $unsignedRoot 'arm64'
          $signedRoot = Join-Path $artifactRoot 'test-signed'
          $signed = Join-Path $signedRoot 'arm64'
          Import-Module ./scripts/LocalPackage.psm1 -Force
          $compose = {
            param([string]$resolvedPayloadDirectory)
            & dotnet restore ./src/OpenClaw.Launcher/OpenClaw.Launcher.csproj --runtime win-arm64 -p:PublishAot=true -p:IncludePackagingContent=true -p:Platform=arm64
            if ($LASTEXITCODE -ne 0) { throw 'Launcher NativeAOT restore failed.' }
            & dotnet restore ./src/OpenClaw.SessionHost/OpenClaw.SessionHost.csproj --runtime win-arm64 -p:PublishAot=true -p:Platform=arm64
            if ($LASTEXITCODE -ne 0) { throw 'Session-host NativeAOT restore failed.' }
            $build = @{
              PayloadDirectory = $resolvedPayloadDirectory
              Architecture = 'arm64'
              PackageVersion = $identity.PackageVersion
              SourceCommit = $commit
              SourceTreeDirty = $false
              IdentityChannel = 'Sideload'
              OutputDirectory = $unsigned
            }
            & ./scripts/Build-MSIX.ps1 @build
            if (-not (Test-Path (Join-Path $unsigned 'OpenClawGateway-arm64.msix') -PathType Leaf)) { throw 'The native package owner did not produce the candidate.' }
          }
          Invoke-LocalPackageMsixBuild -RepositoryRoot $root -Architecture arm64 -PayloadRunId 38964560015 -Compose $compose
          & ./scripts/Sign-TestMSIX.ps1 -ArtifactsDirectory $unsignedRoot -OutputDirectory $signedRoot -IdentityChannel sideload
          $metadata = Get-Content (Join-Path $signed 'msix-metadata.json') -Raw | ConvertFrom-Json
          if ($metadata.packagingCommit -cne $commit -or $metadata.sourceTreeDirty -or $metadata.payloadResolvedCommit -cne '383c124cc32ffee3f8e56f549b88da94d269a4af' -or $metadata.packageVersion -cne $identity.PackageVersion -or $metadata.packageFamilyName -cne $policy.sideloadPackageIdentity.familyName -or $metadata.identityChannel -cne 'sideload' -or $metadata.architecture -cne 'arm64' -or $metadata.signingType -cne 'test' -or -not $metadata.signed) { throw 'Candidate metadata does not match the frozen proof inputs.' }
          $files = @(Get-ChildItem -LiteralPath $signed -File)
          if ($files.Count -ne 3 -or @($files | Where-Object { $_.Extension -notin @('.msix','.json','.cer') }).Count -ne 0) { throw 'Unexpected candidate output; private signing material must not be retained.' }
          $srcTree = (& git rev-parse 'HEAD:src') -join ''
          if ($LASTEXITCODE -ne 0) { throw 'Unable to record runtime source identity.' }
          $pluginTree = (& git rev-parse 'HEAD:plugins') -join ''
          if ($LASTEXITCODE -ne 0) { throw 'Unable to record plugin source identity.' }
          $receipt = [ordered]@{
            schemaVersion = 1
            purpose = 'Disposable installed upgrade and recovery proof only; never publish this test-signed package'
            sourceCommit = $commit
            srcTree = $srcTree
            pluginTree = $pluginTree
            payloadRunId = 38964560015
            payloadCommit = $metadata.payloadResolvedCommit
            releaseTag = $identity.ReleaseTag
            packageVersion = $identity.PackageVersion
            architecture = 'arm64'
            signingType = 'test'
            files = @($files | ForEach-Object { [ordered]@{ name=$_.Name; length=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          }
          [IO.File]::WriteAllText((Join-Path $signed 'proof-candidate-receipt.json'), ($receipt | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))
      - name: Retain only the test-signed candidate, public certificate, and integrity receipts
        uses: actions/upload-artifact@v7
        with:
          name: gateway-recovery-candidate-arm64-test-signed
          path: artifacts/recovery-candidate/test-signed/arm64
          if-no-files-found: error
          retention-days: 14
