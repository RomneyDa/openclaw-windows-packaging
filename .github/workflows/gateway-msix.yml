name: Probe disposable Windows Gateway recovery support

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        type: choice
        options: [test]
        default: test
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read
cache-mode: none

jobs:
  probe:
    if: inputs.signing_mode == 'test' && inputs.publish_release == false
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Probe the signed baseline in this disposable account
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path (Get-Location).Path 'artifacts/recovery-support-probe'
          [IO.Directory]::CreateDirectory($evidence) | Out-Null
          $policy = Get-Content ./release-policy.json -Raw | ConvertFrom-Json
          $identity = $policy.sideloadPackageIdentity
          $existing = @(
            Get-AppxPackage -Name 'OpenClaw.Gateway*'
            Get-AppxPackage -Name 'OpenClawFoundation.OpenClawGateway*'
          )
          if ($existing.Count -ne 0) { throw 'A clean disposable account is required; no existing Gateway registration will be changed.' }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'The native ARM64 proof requires an ARM64 Windows runner.' }
          $asset = 'OpenClawGateway-2026.10.4-msix.0-arm64.msix'
          $packagePath = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/openclaw/openclaw-windows-packaging/releases/download/v2026.10.4-msix.0/$asset" -OutFile $packagePath
          $hash = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne 'a23e16b87de80a28f6eda856871c1fcd9f54d1a2194a65c282151c42d10934dd') { throw 'The immutable signed baseline hash does not match.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $packagePath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -ine [string]$identity.publisher) { throw 'The baseline signature or publisher is not valid.' }
          $owned = $false
          $alias = $null
          $setupExit = $null
          $operationFailure = $null
          $cleanupFailure = $null
          try {
            $owned = $true
            Add-AppxPackage -Path $packagePath
            $installed = @(Get-AppxPackage -Name $identity.name)
            if ($installed.Count -ne 1 -or [string]$installed[0].PackageFamilyName -cne [string]$identity.familyName -or [string]$installed[0].Version -cne '2026.10.400.0') {
              throw 'Windows did not register the exact baseline identity/version.'
            }
            $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\$($identity.familyName)\clawctl.exe"
            if (-not (Test-Path -LiteralPath $alias -PathType Leaf)) { throw 'The package-qualified control alias is absent.' }
            & $alias --version
            if ($LASTEXITCODE -ne 0) { throw 'The installed package-qualified alias failed to execute.' }
            & $alias setup --json > (Join-Path $evidence 'setup.json')
            $setupExit = $LASTEXITCODE
            if ($setupExit -ne 0) { throw "The signed baseline setup failed (exit $setupExit); inspect the setup receipt before attempting compatibility validation." }
            & $alias status --json > (Join-Path $evidence 'status.json')
            if ($LASTEXITCODE -ne 0) { throw 'The recorded baseline session is not ready.' }
          }
          catch { $operationFailure = $_.Exception.Message }
          finally {
            if ($owned) {
              try {
                $packages = @(Get-AppxPackage -Name $identity.name)
                if ($packages.Count -gt 1 -or ($packages.Count -eq 1 -and [string]$packages[0].PackageFamilyName -cne [string]$identity.familyName)) { throw 'Cleanup refused an unexpected registration.' }
                if ($packages.Count -eq 1) {
                  if ($null -eq $alias) { $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\$($identity.familyName)\clawctl.exe" }
                  & $alias teardown --force --json > (Join-Path $evidence 'teardown.json')
                  if ($LASTEXITCODE -ne 0) { throw 'Owned session teardown failed; retain its package until this disposable runner is destroyed.' }
                  Remove-AppxPackage -Package $packages[0].PackageFullName
                }
              }
              catch { $cleanupFailure = $_.Exception.Message }
            }
          }
          $receipt = [ordered]@{
            windows = [Environment]::OSVersion.VersionString
            architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            baselineTag = 'v2026.10.4-msix.0'
            baselineSha256 = $hash
            setupExitCode = $setupExit
            operationFailure = $operationFailure
            cleanupFailure = $cleanupFailure
            remainingRegistrations = @(Get-AppxPackage -Name $identity.name).Count
          }
          [IO.File]::WriteAllText((Join-Path $evidence 'probe.json'), ($receipt | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          if ($null -ne $operationFailure) { throw $operationFailure }
          if ($null -ne $cleanupFailure) { throw $cleanupFailure }
      - name: Retain the support and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-recovery-support-probe
          path: artifacts/recovery-support-probe
          if-no-files-found: error
          retention-days: 90